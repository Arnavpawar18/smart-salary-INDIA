<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SmartSalary India — Evidence-Grounded Statutory Financial Intelligence{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  
  <!-- Google Fonts: Plus Jakarta Sans (Headings), Inter (UI), JetBrains Mono (Hashes/Code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Safe Tailwind Config defined BEFORE CDN script to avoid ReferenceError -->
  <script>
    try {
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      }
    } catch(e) {}


    window.tailwind = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
              950: '#080d1a',
            },
            indigo: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            saffron: {
              50: '#fffbeb',
              500: '#f59e0b',
              600: '#d97706',
            },
            emerald: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
            }
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
  <!-- HTMX 2.0.4 Vendor Script -->
  <script src="/static/js/htmx.min.js"></script>
  <!-- Chart.js 4.4.7 Pinned CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-brand-950 dark:text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
  {% include "partials/navbar.html" %}

  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}
  {% include "partials/ai_assistant_drawer.html" %}
  {% include "partials/simulator_panel.html" %}
  
  <!-- Global Theme Toggle Script -->
  <script>
    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
      window.dispatchEvent(new Event('themeChanged'));
    }
  </script>
  <script src="/static/js/app.js?v={{ asset_version }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SmartSalary India — Salary &amp; Tax Intelligence Platform{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <!-- Tailwind CSS CDN (Pinned v3.4.17 baseline for pure server rendering) -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              800: '#0c4a6e',
              900: '#082f49',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/app.css">
  <!-- HTMX 2.0.4 Vendor Script -->
  <script src="/static/js/htmx.min.js"></script>
  <!-- Chart.js 4.4.7 Pinned CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" integrity="sha256-wFn9u5jZqR3QY7Zt80hN3w9kL4rF8W8X2qGgX2rQY0M=" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">
  {% include "partials/navbar.html" %}

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}
  <script src="/static/js/app.js"></script>
</body>
</html>
